name: Build
on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    name: Build ISO with CMake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools & dependencies
        run: |
          sudo apt update

          sudo apt install -y build-essential cmake xorriso ninja-build

          yes '' | /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
          brew install x86_64-elf-gcc

      - name: Build ISO
        run: |
          cmake -DCMAKE_BUILD_TYPE:STRING=Debug -DCMAKE_C_COMPILER=x86_64-elf-gcc -DCMAKE_CXX_COMPILER=x86_64-elf-g++ --no-warn-unused-cli -S . -B ./build -G Ninja
          cmake --build ./build --config Debug --target iso --
